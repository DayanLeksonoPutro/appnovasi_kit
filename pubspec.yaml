name: appnovasi_kit
description: "Flutter boilerplate framework: config-only integration untuk mempercepat pembuatan app Play Store."
version: 0.3.0
repository: https://github.com/DayanLeksonoPutro/appnovasi_kit
homepage: https://github.com/DayanLeksonoPutro/appnovasi_kit
issue_tracker: https://github.com/DayanLeksonoPutro/appnovasi_kit/issues
topics:
  - flutter
  - boilerplate
  - template
  - in-app-purchase

environment:
  sdk: ^3.12.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
          weight: 400
